name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hublink
          POSTGRES_PASSWORD: hublink_dev_password
          POSTGRES_DB: hublink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hublink -d hublink_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hublink:hublink_dev_password@127.0.0.1:5432/hublink_test
      E2E_DATABASE_URL: postgres://hublink:hublink_dev_password@127.0.0.1:5432/hublink_e2e
      HUB_MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      VAULT_MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Create isolated browser-test database
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try { await pool.query('CREATE DATABASE hublink_e2e'); }
          finally { await pool.end(); }
          JS
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build production images
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --build-arg HUB_EXTENSION_ORIGIN=https://hub.example.test -f apps/api/Dockerfile -t hublink-api:ci .
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -f apps/web/Dockerfile -t hublink-web:ci .
      - name: Verify packaged API and Nginx boundaries
        run: python3 scripts/check-images.py --api-image hublink-api:ci --web-image hublink-web:ci --origin https://hub.example.test
