services:
  postgres:
    image: postgres:16-alpine
    container_name: hublink-postgres
    environment:
      POSTGRES_DB: hublink
      POSTGRES_USER: hublink
      POSTGRES_PASSWORD: hublink_dev_password
    ports:
      - '127.0.0.1:${HUB_DB_PORT:-5439}:5432'
    volumes:
      - hublink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hublink -d hublink']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hublink_pgdata:
