# Only a TLS gateway on the loopback host binding may set X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
    # Keep defensive headers inherited on the SPA entry too.
    expires -1;
    location ~ ^/(api/|health$) {
        proxy_pass http://api:3177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        # Replace untrusted inbound chains; the host gateway must overwrite X-Real-IP.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
    }
}
